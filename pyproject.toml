[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "runbound"
version = "1.0.0a7"
description = "A policy boundary around the tools an AI agent can call: per-tool policy, quotas, human approvals, fail-closed on plane loss, OpenTelemetry spans."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amanjot Singh" }]
keywords = [
    "ai agents",
    "tool calling",
    "guardrails",
    "policy",
    "human in the loop",
    "approvals",
    "opentelemetry",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://runbound.co"
Documentation = "https://runbound.co/docs"
Repository = "https://github.com/runboundai/runbound"
Changelog = "https://github.com/runboundai/runbound/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7.0"]
# The install constraints of the tested floor row (langchain 1.2.11 with langgraph 1.2.0, Python 3.11; `scripts/gate.sh sdk-langchain-matrix`). They are constraints, not a support statement: the combinations
# that were tested are named in the CHANGELOG and docs/design/aai-04-langchain-support.md.
langchain = ["langchain-core", "langchain>=1.2.11,<2", "langgraph>=1.2,<2"]
# AAI-04-5: the real-framework test harness (tests/integration/lc_harness.py). EXACT versions, recorded here and printed by the harness. These are the newest TESTED combination. The
# combinations that ran green (docs/design/aai-04-gate-b-evidence.md section 8; `scripts/gate.sh sdk-langchain-matrix`): langchain 1.2.11 with langgraph 1.2.0 (Python 3.11), langchain 1.3.0 with
# langgraph 1.2.0 (3.13), and the pins below (3.13). Nothing between them is claimed. langchain below 1.2.11 cannot be installed next to langgraph >=1.2 (resolver), so the RFC section 9
# the RFC-era floor (langchain 1.0) is not a tested point. Not a runtime dependency.
langchain-test = [
    "langchain==1.4.6; python_version >= '3.11'",
    "langchain-core==1.6.12; python_version >= '3.11'",
    "langgraph==1.2.16; python_version >= '3.11'",
    "langgraph-checkpoint-sqlite==3.1.2; python_version >= '3.11'",
]
otel = ["opentelemetry-api>=1.39,<2", "opentelemetry-sdk>=1.39,<2"]

[tool.setuptools]
packages = ["runbound", "runbound.integrations", "runbound._rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "plane: runs against a real control-plane process (needs RUNBOUND_PLANE_PYTHON)",
    "legacy: today's decision, captured (R0): must pass on main; a change is a regression unless the register lists it",
    "contract(item, ships=None): a tool-rules contract test (R0); with ships=, a strict xfail on today's engine until that release",
]
