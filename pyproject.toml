[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "runbound"
version = "1.0.0a4"
description = "A policy boundary around the tools an AI agent can call: per-tool policy, quotas, human approvals, fail-closed on plane loss, OpenTelemetry spans."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amanjot Singh" }]
keywords = [
    "ai agents",
    "tool calling",
    "guardrails",
    "policy",
    "human in the loop",
    "approvals",
    "opentelemetry",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://runbound.co"
Documentation = "https://runbound.co/docs"
Repository = "https://github.com/runboundai/runbound"
Changelog = "https://github.com/runboundai/runbound/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7.0"]
langchain = ["langchain-core"]
otel = ["opentelemetry-api>=1.39,<2", "opentelemetry-sdk>=1.39,<2"]

[tool.setuptools]
packages = ["runbound", "runbound.integrations", "runbound._rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "plane: runs against a real control-plane process (needs RUNBOUND_PLANE_PYTHON)",
    "legacy: today's decision, captured (R0): must pass on main; a change is a regression unless the register lists it",
    "contract(item, ships=None): a tool-rules contract test (R0); with ships=, a strict xfail on today's engine until that release",
]
